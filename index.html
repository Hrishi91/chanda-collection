<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9531e">
<title>চাঁদা খাতা — Ganesh Puja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<!-- A66 (audit 2.16): iOS. Four gaps, each of which cost an iPhone collector
     something real.
     · apple-touch-icon pointed at the 512px PNG — 316 KB downloaded for a
       home-screen icon, and WITH an alpha channel, which iOS composites onto
       BLACK before applying its own squircle mask. A flattened 180×180 on the
       tile's own colour is 48 KB and lands the way it was drawn.
     · without apple-mobile-web-app-capable, iOS Safari never runs this
       standalone: an "installed" icon just reopens a browser tab, with the
       address bar eating a line of a small screen.
     · black-translucent lets the saffron header run under the status bar. Safe
       because the CSS already pads with env(safe-area-inset-top) — with a
       plain `default` the phone draws a white strip above an orange header.
     · a home-screen label of "চাঁদা খাতা — Ganesh Puja" is truncated to
       nonsense; apple-mobile-web-app-title gives it the short name. -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="চাঁদা খাতা">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <img id="app-logo" src="icons/icon-192.png" alt="" width="26" height="26" style="border-radius:7px;vertical-align:middle;margin-right:7px">
  <span id="app-title">🙏 চাঁদা খাতা</span>
  <span class="hdr-right">
    <!-- A144: the 👁️ curtain. Lives in the HEADER on purpose — a curtain whose
         state you cannot see from every screen is a curtain somebody forgets is
         drawn, and then spends an afternoon looking for missing money. Hidden
         unless this person can see a confidential kind at all. -->
    <button id="hdr-curtain" type="button" hidden>👁️</button>
    <button id="hdr-refresh" type="button">🔄</button>
    <span id="sync-badge" class="badge ok">✅</span>
  </span>
</header>
<div id="training-bar" role="status" style="display:none"></div>
<div id="net-bar" role="status" style="display:none"></div>
<main id="view"></main>
<nav id="bottomnav">
  <button data-nav="home">🏠<span>হোম</span></button>
  <button data-nav="list">📒<span>খাতা</span></button>
  <button data-nav="report">📊<span>রিপোর্ট</span></button>
  <button data-nav="messages">💬<span>বার্তা</span><i class="nav-dot" id="msg-dot" hidden></i></button>
  <!-- A153: the অনুষ্ঠান gets its own tab, holding everything about it. Hidden
       unless the committee is running one AND this person is on it — see
       programTabOn(). Its label comes from t('nav_program'). -->
  <button data-nav="program" hidden>🎭<span>অনুষ্ঠান</span></button>
  <button data-nav="settings">⚙️<span>সেটিংস</span></button>
</nav>
<script src="js/config.js"></script>

</body>
